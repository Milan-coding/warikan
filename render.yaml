# Render の Blueprint 設定。https://render.com/docs/blueprint-spec
services:
  - type: web
    name: warikan
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # デプロイは GitHub Actions が CI 成功後に Deploy Hook で起動する(.github/workflows/ci.yml)
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
