name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v

  # テストが通ったら Render の Deploy Hook を呼んでデプロイする。
  # Render 側の自動デプロイ(After CI Checks Pass)が発火しなかったため、こちらから起動する。
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null

      - name: Skip (secret not set)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::warning::RENDER_DEPLOY_HOOK_URL が未設定のためデプロイをスキップしました"
