name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 本番と同じ PostgreSQL でテストする(ローカルでは DATABASE_URL 未設定なら SQLite)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warikan
          POSTGRES_PASSWORD: warikan
          POSTGRES_DB: warikan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://warikan:warikan@localhost:5432/warikan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # マイグレーションが最後まで適用でき、モデル定義と食い違っていないことを確認する
      - name: Migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Test
        run: pytest -v

  # テストが通ったら Render の Deploy Hook を呼んでデプロイする。
  # Render 側の自動デプロイ(After CI Checks Pass)が発火しなかったため、こちらから起動する。
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null

      - name: Skip (secret not set)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::warning::RENDER_DEPLOY_HOOK_URL が未設定のためデプロイをスキップしました"
